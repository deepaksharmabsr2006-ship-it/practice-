services:
  - type: web
    name: driver-safety-telematics
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python ml/model_trainer.py
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        value: sqlite:///./telematics_fleet.db
